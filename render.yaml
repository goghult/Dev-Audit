databases:
  - name: code-auditor-db
    databaseName: code_auditor
    user: code_auditor
    plan: free

services:
  - type: web
    name: code-auditor-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/audit/providers
    plan: free
    envVars:
      - key: DB_URL
        fromDatabase:
          name: code-auditor-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: code-auditor-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: code-auditor-db
          property: password
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_FRONTEND_URL
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false

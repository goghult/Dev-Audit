server:
  port: ${PORT:8081}

spring:
  application:
    name: code-auditor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/code_auditor}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    google:
      genai:
        chat:
          enabled: false
        api-key: ${GOOGLE_GEMINI_API_KEY:${GEMINI_API_KEY:${GOOGLE_API_KEY:}}}
        project-id: ${GOOGLE_CLOUD_PROJECT:233392738819}
        location: ${GOOGLE_CLOUD_LOCATION:us-central1}
    openai:
      # Ollama exposes an OpenAI-compatible endpoint locally.
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      api-key: ${OLLAMA_API_KEY:ollama}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
          temperature: 0.3

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2}

# Default AI provider: 'gemini' or 'groq'
app:
  ai:
    default-provider: gemini

jwt:
  secret-key: ${JWT_SECRET_KEY:${JWT_SECRET:Y29kZWF1ZGl0b3ItZGV2LWp3dC1zZWNyZXQta2V5LTI1Ng==}}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000


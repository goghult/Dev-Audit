server:
  port: ${PORT:8081}

spring:
  application:
    name: code-auditor
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:code_auditor}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GEMINI_API_KEY:${GEMINI_API_KEY:${GOOGLE_API_KEY:}}}
        project-id: ${GOOGLE_CLOUD_PROJECT:233392738819}
        location: ${GOOGLE_CLOUD_LOCATION:us-central1}

app:
  ai:
    default-provider: gemini

jwt:
  secret-key: ${JWT_SECRET_KEY:${JWT_SECRET:Y29kZWF1ZGl0b3ItZGV2LWp3dC1zZWNyZXQta2V5LTI1Ng==}}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

